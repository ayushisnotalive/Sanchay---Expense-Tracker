version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sanchay-postgres
    restart: always
    environment:
      POSTGRES_DB: sanchay_db
      POSTGRES_USER: sanchay
      POSTGRES_PASSWORD: sanchay_secure_password
    ports:
      - "5432:5432"
    volumes:
      - sanchay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanchay -d sanchay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: sanchay-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sanchay_db
      SPRING_DATASOURCE_USERNAME: sanchay
      SPRING_DATASOURCE_PASSWORD: sanchay_secure_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_THREADS_VIRTUAL_ENABLED: "true"

volumes:
  sanchay_pgdata:
