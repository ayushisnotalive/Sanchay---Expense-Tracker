server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: sanchay-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:sanchaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      pool-name: SanchayHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  cache:
    type: caffeine
    cache-names:
      - exchangeRates
      - analyticsSummary
      - userCategories
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

sanchay:
  jwt:
    secret: "${SANCHAY_JWT_SECRET:${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}}"
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  ai:
    gemini-api-key: "${GEMINI_API_KEY:}"
    gemini-model: "gemini-2.0-flash"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
